<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAS — Estado da publicação</title><style>body{font:16px system-ui,sans-serif;background:#f8f7f5;color:#28231f;margin:8vh auto;max-width:650px;padding:24px}h1{font-size:30px}li{margin:18px 0}a{color:#572b38}</style><h1>Verificação da publicação SILAS</h1><p id="status">A analisar…</p><ol id="checks"></ol><p><a href="index.html">Abrir o WorkTime real</a></p><script>async function main(){const c=document.querySelector('#checks');const tests=[['HTML principal','index.html'],['Configuração','assets/js/config.js'],['Aplicação','assets/js/app.js'],['Garrafeira','assets/js/wines.js'],['Entrada','assets/js/bootstrap.js']];let ok=true;for(const [name,path] of tests){try{const r=await fetch(path,{cache:'no-store'}),t=r.headers.get('content-type')||'';if(!r.ok||/text\/html/i.test(t)&&path!== 'index.html')throw Error('HTTP '+r.status+' / '+t);c.insertAdjacentHTML('beforeend',`<li>${name}: disponível (${r.status})</li>`)}catch(e){ok=false;c.insertAdjacentHTML('beforeend',`<li>${name}: erro de publicação</li>`)}}document.querySelector('#status').textContent=ok?'Ficheiros principais acessíveis. Ainda é necessário validar o login real.':'Publicação incompleta. Verifica a estrutura das pastas.'}main()</script></html>
